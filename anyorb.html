<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>ANYORB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#02040a;--fg:#eef2fb;--muted:#8b95ab;--dim:#4e566c;--line:rgba(130,160,255,.11);--glass:rgba(8,12,24,.58);--glass2:rgba(12,16,30,.88);--accent:#5ce1ff;--c-idle:#5ce1ff;--c-connect:#ffc14a;--c-listen:#6dff9a;--c-think:#c9a0ff;--c-speak:#6b9bff;--c-error:#ff6b8a;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 40%,rgba(25,40,80,.32),transparent 65%),var(--bg)}
#orbHost{position:absolute;inset:0}#orbHost canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none}
.top>*{pointer-events:auto}.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.spacer{flex:1}.actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);font-size:12px;color:var(--muted)}
.pill.pri{background:linear-gradient(135deg,#3d6ef5,var(--accent));border:none;color:#021018;font-weight:600}
.ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center}
.side{position:fixed;left:24px;top:50%;transform:translateY(-54%);z-index:15;max-width:280px;pointer-events:none}
.side .eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.side h1{font-size:clamp(22px,3.5vw,36px);font-weight:300;line-height:1.15;margin-bottom:10px}
.side h1 em{font-style:normal;color:var(--sc,var(--c-idle))}
.side p{font-size:13px;line-height:1.6;color:var(--muted)}
.dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px);max-width:96vw}
.sb{padding:8px 12px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.sb[aria-pressed="true"]{color:#021018;background:var(--sc,var(--accent));font-weight:600}
.sw{width:18px;height:18px;border-radius:50%;background:var(--sw);border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:#fff}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(300px,94vw);z-index:40;background:var(--glass2);border-left:1px solid var(--line);backdrop-filter:blur(28px);transform:translateX(105%);transition:transform .4s var(--ease);padding:16px;overflow-y:auto}
.drawer.open{transform:none}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:13px;color:var(--muted)}
.tg{width:36px;height:20px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.3);position:relative}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.2s}
.tg[aria-checked="true"]{border-color:var(--accent)}.tg[aria-checked="true"]::after{left:18px;background:var(--accent)}
.emojiPick{font-size:18px;padding:6px 10px}
@media(max-width:700px){
  .side{left:0;right:0;top:auto;bottom:110px;transform:none;max-width:none;padding:0 24px;text-align:center}
  .side h1{font-size:20px;text-shadow:0 2px 24px #000}
  .side p{margin:0 auto;max-width:280px;color:rgba(200,210,230,.75);text-shadow:0 1px 12px #000}
  .dock{bottom:12px;left:8px;right:8px;transform:none}
}
</style>
</head>
<body>
<div id="stage"><div id="orbHost"></div></div>
<header class="top">
  <div class="brand"><i></i><span>anyorb</span></div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="pill pri" id="runBtn">Run</button>
    <button class="pill" id="catBtn">🐱 Cats</button>
    <button class="ic" id="setBtn">⚙</button>
  </div>
</header>
<aside class="side">
  <div class="eb" id="eyebrow">Idle</div>
  <h1>A presence for <em id="title">voice</em>.</h1>
  <p id="desc">Zero dependencies. One script tag. Any stack.</p>
</aside>
<nav class="dock" id="states">
  <button class="sb" data-s="idle" style="--sc:var(--c-idle)" aria-pressed="true">Idle</button>
  <button class="sb" data-s="connecting" style="--sc:var(--c-connect)">Connect</button>
  <button class="sb" data-s="listening" style="--sc:var(--c-listen)">Listen</button>
  <button class="sb" data-s="thinking" style="--sc:var(--c-think)">Think</button>
  <button class="sb" data-s="speaking" style="--sc:var(--c-speak)">Speak</button>
  <button class="sb" data-s="error" style="--sc:var(--c-error)">Error</button>
  <button class="sw" data-t="glacier" style="--sw:#5ce1ff" aria-pressed="true"></button>
  <button class="sw" data-t="nova" style="--sw:#ff5ae0"></button>
  <button class="sw" data-t="ember" style="--sw:#ffc14a"></button>
</nav>
<aside class="drawer" id="drawer">
  <div class="dh"><strong>Settings</strong><button class="ic" id="closeSet">✕</button></div>
  <div class="row"><span>🐱 Cat particles</span><button class="tg" id="tCats" role="switch" aria-checked="false"></button></div>
  <div id="spritePick" style="display:none;margin-top:8px">
    <button class="pill emojiPick" data-e="🐱">🐱</button>
    <button class="pill emojiPick" data-e="✨">✨</button>
    <button class="pill emojiPick" data-e="💜">💜</button>
    <button class="pill emojiPick" data-e="🔥">🔥</button>
    <button class="pill emojiPick" data-e="⭐">⭐</button>
  </div>
  <p style="margin-top:16px;font-size:12px;color:var(--dim)">Forms (optional): <code style="color:var(--accent)">orb.set('form','question'|'face'|'x'|null)</code></p>
</aside>
<script src="anyorb.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const DESC={idle:"Breathing. Waiting.",connecting:"Link forming.",listening:"Hearing you.",thinking:"Orbiting the idea.",speaking:"Voice in motion.",error:"Signal broken."};
const TITLE={idle:"voice",connecting:"link",listening:"sound",thinking:"thought",speaking:"speech",error:"noise"};
const COL={idle:"var(--c-idle)",connecting:"var(--c-connect)",listening:"var(--c-listen)",thinking:"var(--c-think)",speaking:"var(--c-speak)",error:"var(--c-error)"};
const orb=new AnyOrb($("orbHost"),{state:"idle",particles:1800,theme:"glacier",onFrame:o=>{if(o.state==="listening"||o.state==="speaking"){const t=o.time;o.setLevel(o.state==="listening"?Math.max(0,Math.sin(t*1.9)*.45+.35):.35+.35*Math.sin(t*7.5))}}});
function sync(s){
  document.querySelectorAll("#states .sb").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===s)));
  $("eyebrow").textContent=s;$("title").textContent=TITLE[s]||s;$("desc").textContent=DESC[s]||"";
  document.documentElement.style.setProperty("--sc",COL[s]);
}
$("orbHost").addEventListener("anyorb:statechange",e=>sync(e.detail.state));
document.querySelectorAll("#states .sb").forEach(b=>b.onclick=()=>orb.setState(b.dataset.s));
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed","false"));s.setAttribute("aria-pressed","true");orb.set("theme",s.dataset.t)});
function setCats(on){
  $("tCats").setAttribute("aria-checked",String(on));
  $("catBtn").textContent=on?"● Dots":"🐱 Cats";
  $("spritePick").style.display=on?"block":"none";
  orb.set("particleMode",on?"emoji":"dot");
  orb.set("sprite","🐱");
  if(on) orb.set("particles",700); else orb.set("particles",1800);
}
$("tCats").onclick=()=>setCats($("tCats").getAttribute("aria-checked")!=="true");
$("catBtn").onclick=()=>setCats($("tCats").getAttribute("aria-checked")!=="true");
document.querySelectorAll(".emojiPick").forEach(b=>b.onclick=()=>orb.set("sprite",b.dataset.e));
$("setBtn").onclick=()=>$("drawer").classList.add("open");
$("closeSet").onclick=()=>$("drawer").classList.remove("open");
const SCRIPT=[{s:"connecting",d:1},{s:"listening",d:2},{s:"thinking",d:1.3},{s:"speaking",d:2.5},{s:"idle",d:.4}];
let run=false,timers=[];
$("runBtn").onclick=()=>{if(run){run=false;timers.forEach(clearTimeout);timers=[];$("runBtn").textContent="Run";return}run=true;$("runBtn").textContent="■ Stop";let d=0;SCRIPT.forEach(st=>{timers.push(setTimeout(()=>{if(run)orb.setState(st.s)},d*1000));d+=st.d});timers.push(setTimeout(()=>{run=false;$("runBtn").textContent="Run"},d*1000+50))};
})();
</script>
</body>
</html>
