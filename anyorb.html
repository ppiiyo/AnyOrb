<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="ANYORB — zero-dependency voice presence engine.">
<meta name="theme-color" content="#02040a">
<title>ANYORB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02040a;--fg:#eef2fb;--muted:#8b95ab;--dim:#4e566c;
  --line:rgba(130,160,255,.11);--glass:rgba(8,12,24,.58);--glass2:rgba(12,16,30,.88);
  --accent:#5ce1ff;--c-idle:#5ce1ff;--c-connect:#ffc14a;--c-listen:#6dff9a;
  --c-think:#c9a0ff;--c-speak:#6b9bff;--c-error:#ff6b8a;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;background:rgba(120,140,255,.14);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 45%,transparent)}
select{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--fg);font:inherit;font-size:12.5px}
#stage{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 90% 70% at 50% 40%,rgba(25,40,80,.32),transparent 65%),radial-gradient(ellipse 50% 40% at 80% 80%,rgba(80,30,100,.12),transparent 50%),var(--bg)}
#orbHost{position:absolute;inset:0}
#orbHost canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#orbHost canvas:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 22px;padding-top:max(14px,env(safe-area-inset-top));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;letter-spacing:.02em}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.4)}}
.tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-left:4px}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:12px;font-weight:500;color:var(--muted);transition:all .2s var(--ease)}
.pill:hover{color:var(--fg);border-color:rgba(140,170,255,.28);background:var(--glass2)}
.pill.pri{background:linear-gradient(135deg,#3d6ef5,var(--accent));border-color:transparent;color:#021018;font-weight:600;box-shadow:0 4px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.pill.pri:hover{filter:brightness(1.08)}
.ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);display:grid;place-items:center;color:var(--muted);transition:.2s;font-size:13px}
.ic:hover,.ic.on{color:var(--fg);border-color:rgba(140,170,255,.32)}
.ic.on{color:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 22%,transparent)}
.side{position:fixed;left:24px;top:50%;transform:translateY(-54%);z-index:15;max-width:290px;pointer-events:none}
.side .eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.side .eb::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--sc,var(--c-idle));box-shadow:0 0 10px var(--sc,var(--c-idle))}
.side h1{font-size:clamp(24px,3.6vw,38px);font-weight:300;line-height:1.15;letter-spacing:-.03em;margin-bottom:11px}
.side h1 em{font-style:normal;font-weight:400;color:var(--sc,var(--c-idle));text-shadow:0 0 40px color-mix(in srgb,var(--sc,var(--c-idle)) 40%,transparent);transition:color .5s,text-shadow .5s}
.side p{font-size:13px;line-height:1.65;color:var(--muted);max-width:250px}
.side .meta{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim)}
.side .meta b{color:var(--muted);font-weight:500}
.dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 48px rgba(0,0,0,.55),inset 0 1px 0 rgba(200,220,255,.04);max-width:96vw;flex-wrap:wrap;justify-content:center}
.states{display:flex;gap:2px;padding:2px;border-radius:999px;background:rgba(0,0,0,.3);flex-wrap:wrap;justify-content:center}
.sb{padding:8px 13px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--muted);transition:all .2s var(--ease);white-space:nowrap}
.sb:hover{color:var(--fg)}
.sb[aria-pressed="true"]{color:#021018;background:var(--sc,var(--accent));box-shadow:0 0 16px color-mix(in srgb,var(--sc,var(--accent)) 35%,transparent);font-weight:600}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.themes{display:flex;gap:5px;padding:0 3px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--sw) 80%,#fff),var(--sw));transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.sw:hover{transform:scale(1.22)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 10px var(--sw)}
.dock .ic{width:30px;height:30px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,94vw);z-index:40;background:var(--glass2);border-left:1px solid var(--line);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);transform:translateX(105%);transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:-24px 0 64px rgba(0,0,0,.45)}
.drawer.open{transform:translateX(0)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.db{flex:1;overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:20px}
.g label{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.ctl{display:grid;grid-template-columns:1fr 48px;align-items:center;gap:8px;margin-bottom:9px}
.ctl span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent);text-align:right}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.tg{width:36px;height:20px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.28);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.2s}
.tg[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
.tg[aria-checked="true"]::after{left:18px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:7px}
.df .pill{flex:1;justify-content:center;font-size:11.5px}
.vu-w{position:fixed;left:24px;bottom:22px;z-index:15;display:flex;align-items:center;gap:8px;pointer-events:none}
.vu{width:80px;height:2.5px;border-radius:99px;background:rgba(120,140,255,.1);overflow:hidden}
.vu i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--c-listen),var(--c-connect));border-radius:99px}
.vu-l{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.st{position:fixed;right:24px;bottom:22px;z-index:15;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);text-align:right;line-height:1.65;pointer-events:none}
.st b{color:var(--muted);font-weight:500}
.emojiPick{font-size:16px;padding:6px 10px}
@media(max-width:700px){
  .side{display:block;left:0;right:0;top:auto;bottom:118px;transform:none;max-width:none;padding:0 28px;text-align:center;z-index:12}
  .side .eb{justify-content:center;font-size:9px;opacity:.75;margin-bottom:6px}
  .side h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px;text-shadow:0 2px 28px rgba(0,0,0,.65)}
  .side p{max-width:280px;margin:0 auto;font-size:12px;line-height:1.5;color:rgba(200,210,230,.72);text-shadow:0 1px 16px rgba(0,0,0,.8)}
  .side .meta{display:none}
  .dock{bottom:12px;left:8px;right:8px;transform:none;width:auto;border-radius:16px}
  .sb{padding:7px 10px;font-size:11px}
  .st,.vu-w{display:none}
  .tag{display:none}
  .drawer{width:100%}
  .top{padding:10px 12px}
  .actions .pill{padding:6px 10px;font-size:11px}
}
@media(prefers-reduced-motion:reduce){.brand i{animation:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="orbHost"></div></div>
<header class="top">
  <div class="brand"><i></i><span>anyorb</span><span class="tag">presence</span></div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="pill" id="soundBtn">Sound on</button>
    <button class="pill pri" id="runBtn">Run</button>
    <button class="pill" id="catBtn">🐱 Cats</button>
    <button class="ic" id="setBtn" title="Settings">⚙</button>
  </div>
</header>
<aside class="side">
  <div class="eb" id="eyebrow">Idle</div>
  <h1>A presence<br>for <em id="title">voice</em>.</h1>
  <p id="desc">Zero dependencies. One script tag. Works where React can’t.</p>
  <div class="meta"><b id="pcount">2200</b> particles · <b id="fps">—</b> fps</div>
</aside>
<nav class="dock">
  <div class="states" id="states">
    <button class="sb" data-s="idle" style="--sc:var(--c-idle)" aria-pressed="true">Idle</button>
    <button class="sb" data-s="connecting" style="--sc:var(--c-connect)">Connect</button>
    <button class="sb" data-s="listening" style="--sc:var(--c-listen)">Listen</button>
    <button class="sb" data-s="thinking" style="--sc:var(--c-think)">Think</button>
    <button class="sb" data-s="speaking" style="--sc:var(--c-speak)">Speak</button>
    <button class="sb" data-s="error" style="--sc:var(--c-error)">Error</button>
  </div>
  <div class="sep"></div>
  <div class="themes" id="themes">
    <button class="sw" data-t="glacier" style="--sw:#5ce1ff" aria-pressed="true" title="Glacier"></button>
    <button class="sw" data-t="nova" style="--sw:#ff5ae0" title="Nova"></button>
    <button class="sw" data-t="acid" style="--sw:#6dff9a" title="Acid"></button>
    <button class="sw" data-t="ember" style="--sw:#ffc14a" title="Ember"></button>
    <button class="sw" data-t="rose" style="--sw:#ff8fb8" title="Rose"></button>
  </div>
  <div class="sep"></div>
  <button class="ic" id="randBtn" title="Random">🎲</button>
  <button class="ic" id="resetBtn" title="Reset">↺</button>
</nav>
<div class="vu-w"><div class="vu"><i id="vu"></i></div><span class="vu-l">level</span></div>
<div class="st"><div><b id="stName">idle</b></div><div>drag · scroll · click</div></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><h2>Settings</h2><button class="ic" id="closeSet">✕</button></div>
  <div class="db">
    <div class="g"><label>Form & motion</label>
      <div class="ctl"><input type="range" data-p="particles" min="400" max="4000" step="100" value="2200"><span data-o="particles">2200</span></div>
      <div class="ctl"><input type="range" data-p="scale" min="50" max="150" value="100"><span data-o="scale">1.00×</span></div>
      <div class="ctl"><input type="range" data-p="speed" min="0" max="200" value="70"><span data-o="speed">0.70×</span></div>
      <div class="ctl"><input type="range" data-p="turbulence" min="0" max="100" value="18"><span data-o="turbulence">18%</span></div>
      <div class="ctl"><input type="range" data-p="spin" min="0" max="200" value="50"><span data-o="spin">0.50×</span></div>
    </div>
    <div class="g"><label>Light & texture</label>
      <div class="ctl"><input type="range" data-p="glow" min="0" max="100" value="70"><span data-o="glow">70%</span></div>
      <div class="ctl"><input type="range" data-p="trails" min="0" max="80" value="25"><span data-o="trails">25%</span></div>
      <div class="ctl"><input type="range" data-p="psize" min="50" max="180" value="100"><span data-o="psize">1.00×</span></div>
    </div>
    <div class="g"><label>Behavior</label>
      <div class="row"><span>Animate</span><button class="tg" id="tAnim" role="switch" aria-checked="true"></button></div>
      <div class="row"><span>Pointer gravity</span><button class="tg" id="tGrav" role="switch" aria-checked="true"></button></div>
      <div class="row"><span>Constellation</span><button class="tg" id="tLinks" role="switch" aria-checked="true"></button></div>
      <div class="row"><span>State tint</span><button class="tg" id="tTint" role="switch" aria-checked="true"></button></div>
      <div class="row"><span>🐱 Cat particles</span><button class="tg" id="tCats" role="switch" aria-checked="false"></button></div>
    </div>
    <div class="g" id="spritePick" style="display:none"><label>Sprite</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <button type="button" class="pill emojiPick" data-e="🐱">🐱</button>
        <button type="button" class="pill emojiPick" data-e="✨">✨</button>
        <button type="button" class="pill emojiPick" data-e="💜">💜</button>
        <button type="button" class="pill emojiPick" data-e="🔥">🔥</button>
        <button type="button" class="pill emojiPick" data-e="⭐">⭐</button>
        <button type="button" class="pill emojiPick" data-e="🫧">🫧</button>
      </div>
    </div>
    <div class="g"><label>Quality</label>
      <select id="quality">
        <option value="eco">Eco · 1×</option>
        <option value="balanced" selected>Balanced · 1.5×</option>
        <option value="sharp">Sharp · 2×</option>
      </select>
    </div>
  </div>
  <div class="df">
    <button class="pill" id="exportBtn">Export PNG</button>
    <button class="pill pri" id="copyCfg">Copy config</button>
  </div>
</aside>
<script src="anyorb.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const DESC={idle:"Breathing. Waiting. Ready for the next signal.",connecting:"Particles collapsing into form — the link is forming.",listening:"Pulling sound from the air. Reacting to every breath.",thinking:"Orbiting the idea. Processing in quiet rotation.",speaking:"Wave surface driven by the agent’s voice.",error:"Signal broken. A brief scatter, then recovery."};
const TITLE={idle:"voice",connecting:"link",listening:"sound",thinking:"thought",speaking:"speech",error:"noise"};
const COL={idle:"var(--c-idle)",connecting:"var(--c-connect)",listening:"var(--c-listen)",thinking:"var(--c-think)",speaking:"var(--c-speak)",error:"var(--c-error)"};
let tick=0,muted=false,ctx=null,cats=false;
function audio(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}}
function chime(s){if(muted||!ctx)return;const f={idle:392,connecting:330,listening:523,thinking:294,speaking:440,error:196}[s]||392;const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.045,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.75);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.8)}
function toast(m){let b=document.getElementById("toasts");if(!b){b=document.createElement("div");b.id="toasts";b.style.cssText="position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none";document.body.appendChild(b)}const t=document.createElement("div");t.style.cssText="padding:9px 16px;border-radius:999px;background:rgba(12,16,30,.92);border:1px solid rgba(130,160,255,.14);backdrop-filter:blur(16px);font-size:12.5px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.4)";t.textContent=m;b.appendChild(t);setTimeout(()=>t.remove(),1800)}
const orb=new AnyOrb($("orbHost"),{state:"connecting",particles:2200,theme:"glacier",onFrame:o=>{
  $("vu").style.transform="scaleX("+o.smoothLevel.toFixed(3)+")";
  if(o.state==="listening"||o.state==="speaking"){const t=o.time;o.setLevel(o.state==="listening"?Math.max(0,Math.sin(t*1.9)*.45+.35):.35+.35*Math.sin(t*7.5))}
  if(++tick%12===0)$("fps").textContent=Math.round(o.fps);
}});
function sync(s){
  document.querySelectorAll("#states .sb").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===s)));
  $("stName").textContent=s;$("eyebrow").textContent=s;$("title").textContent=TITLE[s]||s;$("desc").textContent=DESC[s]||"";
  document.documentElement.style.setProperty("--sc",COL[s]);
  $("eyebrow").style.setProperty("--sc",COL[s]);$("title").style.setProperty("--sc",COL[s]);
  chime(s);
}
$("orbHost").addEventListener("anyorb:statechange",e=>sync(e.detail.state));
document.querySelectorAll("#states .sb").forEach(b=>b.onclick=()=>{audio();orb.setState(b.dataset.s)});
document.querySelectorAll("#themes .sw").forEach(s=>s.onclick=()=>{
  document.querySelectorAll("#themes .sw").forEach(x=>x.setAttribute("aria-pressed","false"));
  s.setAttribute("aria-pressed","true");orb.set("theme",s.dataset.t);
  document.documentElement.style.setProperty("--accent",AnyOrb.THEMES[s.dataset.t].core);
});
$("resetBtn").onclick=()=>{orb.setState("idle");orb.set("theme","glacier");orb.set("form",null);setCats(false);document.querySelectorAll("#themes .sw").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.t==="glacier")))};
$("randBtn").onclick=()=>{const th=Object.keys(AnyOrb.THEMES),t=th[Math.random()*th.length|0];document.querySelectorAll("#themes .sw").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.t===t)));orb.set("theme",t);orb.setState(["idle","listening","thinking","speaking"][Math.random()*4|0])};
const dr=$("drawer");
const openSet=o=>{dr.classList.toggle("open",o);dr.setAttribute("aria-hidden",String(!o));$("setBtn").classList.toggle("on",o)};
$("setBtn").onclick=()=>openSet(!dr.classList.contains("open"));
$("closeSet").onclick=()=>openSet(false);
document.querySelectorAll("[data-p]").forEach(inp=>{
  const k=inp.dataset.p, out=document.querySelector('[data-o="'+k+'"]');
  const fmt=v=>{if(k==="particles") return String(v);if(["scale","speed","spin","psize"].includes(k)) return (v/100).toFixed(2)+"×";return v+"%";};
  inp.oninput=()=>{
    const v=+inp.value; if(out) out.textContent=fmt(v);
    if(k==="particles"){ orb.set("particles",v); $("pcount").textContent=String(v); }
    else if(k==="scale") orb.set("scale",v/100);
    else if(k==="speed") orb.set("speed",v/100);
    else if(k==="turbulence") orb.set("turbulence",v/100);
    else if(k==="spin") orb.set("spin",v/100);
    else if(k==="glow") orb.set("glow",v/100);
    else if(k==="trails") orb.set("trails",v/100);
    else if(k==="psize") orb.set("psize",v/100);
  };
});
const wire=(id,fn)=>{const el=$(id);el.onclick=()=>{const n=el.getAttribute("aria-checked")!=="true";el.setAttribute("aria-checked",String(n));fn(n)}};
wire("tAnim",v=>orb.set("animate",v));
wire("tGrav",v=>orb.set("grav",v));
wire("tLinks",v=>orb.set("links",v));
wire("tTint",v=>orb.set("tint",v));
function setCats(on){
  cats=!!on;
  $("tCats").setAttribute("aria-checked",String(cats));
  $("catBtn").textContent=cats?"● Dots":"🐱 Cats";
  $("spritePick").style.display=cats?"block":"none";
  orb.set("particleMode",cats?"emoji":"dot");
  if(cats){
    orb.set("sprite","🐱"); orb.set("particles",700);
    const inp=document.querySelector('[data-p="particles"]');
    if(inp){inp.value=700; const o=document.querySelector('[data-o="particles"]'); if(o)o.textContent="700";}
    $("pcount").textContent="700"; toast("Cat mode 🐱");
  } else {
    orb.set("particles",2200);
    const inp=document.querySelector('[data-p="particles"]');
    if(inp){inp.value=2200; const o=document.querySelector('[data-o="particles"]'); if(o)o.textContent="2200";}
    $("pcount").textContent="2200"; toast("Dot mode");
  }
}
$("tCats").onclick=()=>setCats($("tCats").getAttribute("aria-checked")!=="true");
$("catBtn").onclick=()=>setCats(!cats);
document.querySelectorAll(".emojiPick").forEach(b=>b.onclick=()=>{orb.set("sprite",b.dataset.e);toast("Sprite "+b.dataset.e)});
$("quality").onchange=e=>orb.set("quality",e.target.value);
$("exportBtn").onclick=()=>{try{const c=$("orbHost").querySelector("canvas");const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="anyorb.png";a.click();toast("PNG exported")}catch(e){toast("Export failed")}};
$("copyCfg").onclick=()=>navigator.clipboard.writeText(JSON.stringify({state:orb.state,theme:orb.o.theme,particles:orb.o.particles,particleMode:orb.o.particleMode,sprite:orb.o.sprite},null,2)).then(()=>toast("Config copied"));
$("soundBtn").onclick=()=>{audio();muted=!muted;$("soundBtn").textContent=muted?"Sound off":"Sound on"};
const SCRIPT=[{s:"connecting",d:1.1},{s:"listening",d:2},{s:"thinking",d:1.4},{s:"speaking",d:3},{s:"idle",d:.5}];
let timers=[],run=false;
const stop=()=>{run=false;timers.forEach(clearTimeout);timers=[];$("runBtn").textContent="Run"};
$("runBtn").onclick=()=>{if(run){stop();return}audio();run=true;$("runBtn").textContent="■ Stop";let d=0;SCRIPT.forEach(st=>{timers.push(setTimeout(()=>{if(run)orb.setState(st.s)},d*1000));d+=st.d});timers.push(setTimeout(stop,d*1000+80))};
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;
  if(e.key>="1"&&e.key<="6"){audio();orb.setState(AnyOrb.STATES[+e.key-1])}
  if(e.code==="Space"){e.preventDefault();$("runBtn").click()}
  if(e.key.toLowerCase()==="r")$("randBtn").click();
  if(e.key.toLowerCase()==="s")$("soundBtn").click();
  if(e.key===",")openSet(!dr.classList.contains("open"));
  if(e.key==="Escape")openSet(false);
});
document.addEventListener("pointerdown",audio,{once:true});
$("pcount").textContent="2200";
setTimeout(()=>orb.setState("idle"),1200);
})();
</script>
</body>
</html>
