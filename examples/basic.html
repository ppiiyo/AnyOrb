<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANYORB — basic embed</title>
  <style>
    html, body { height: 100%; margin: 0; background: #02040a; display: grid; place-items: center; }
    voice-orb { width: min(280px, 70vw); height: min(280px, 70vw); }
  </style>
</head>
<body>
  <!-- CDN or relative ../anyorb.js when served from repo -->
  <script src="../anyorb.js"></script>
  <voice-orb state="idle" theme="glacier"></voice-orb>
  <script>
    const el = document.querySelector("voice-orb");
    // Demo cycle
    const seq = ["connecting", "listening", "thinking", "speaking", "idle"];
    let i = 0;
    setInterval(() => {
      el.setAttribute("state", seq[i++ % seq.length]);
    }, 2200);
  </script>
</body>
</html>
